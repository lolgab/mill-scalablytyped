name: ci

on:
  push:
    branches:
      - main
    tags:
      - "*"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Mill cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/mill
          key: mill-${{ hashFiles('build.mill') }}
      - name: Coursier cache
        uses: actions/cache@v3
        with:
          path: ~/.cache/coursier
          key: ivy-${{ hashFiles('build.mill') }}
          restore-keys: |
            ivy-${{ hashFiles('build.mill') }}
            ivy
      - name: Compilation cache
        uses: actions/cache@v3
        with:
          path: ./out
          key: out
      - uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "11"
      - name: Check formatting
        run: ./mill --no-daemon --ticker false mill.scalalib.scalafmt.ScalafmtModule/checkFormatAll __.sources
      - name: Check scalafix
        run: ./mill --no-daemon --ticker false __.fix --check
      - name: Compile
        run: ./mill --no-daemon --ticker false __.compile
      - name: Publish Artifacts
        run: ./mill --no-daemon --ticker false __.publishArtifacts
    # - name: Test
    #   run:
    #     ./mill --no-daemon --ticker false __.test
  publish-sonatype:
    if: github.repository == 'lolgab/mill-scalablytyped' && contains(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    env:
      MILL_PGP_SECRET_BASE64: ${{ secrets.SONATYPE_PGP_PRIVATE_KEY }}
      MILL_PGP_PASSPHRASE: ${{ secrets.SONATYPE_PGP_PRIVATE_KEY_PASSWORD }}
      MILL_SONATYPE_USERNAME: ${{ secrets.SONATYPE_USER }}
      MILL_SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      LANG: "en_US.UTF-8"
      LC_MESSAGES: "en_US.UTF-8"
      LC_ALL: "en_US.UTF-8"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Coursier cache
        uses: actions/cache@v3
      - uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "11"
      - name: Publish to Maven Central
        run: |
          if [[ $(git tag --points-at HEAD) != '' ]]; then
            ./mill mill.javalib.SonatypeCentralPublishModule/
          fi
